repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix]

  - repo: local
    hooks:
      - id: top-of-file-comments
        name: documentation only at top of file (policy)
        entry: python tools/check_comments.py
        language: python
        types: [python]
        exclude: ^src/amazonmusic/
